name: MVPInstallIdentityKitDemo
options:
  bundleIdPrefix: de.mvp-systems
  deploymentTarget:
    iOS: "16.0"

packages:
  MVPInstallIdentityKit:
    path: ..

targets:
  MVPInstallIdentityKitDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MVPInstallIdentityKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mvp-systems.MVPInstallIdentityKitDemo
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
